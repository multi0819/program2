name: Build facility report APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check touch controls
        run: node tests/touch-controls.cjs && node tests/chiller-schedule.cjs && node tests/fcu-time.cjs && node tests/inactive-report.cjs
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true
      - name: Verify APK signature and install metadata
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: FacilityReport-v1.0.9
          path: android/app/build/outputs/apk/debug/app-debug.apk
