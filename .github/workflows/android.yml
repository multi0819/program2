name: Build facility report APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check touch controls
        run: node tests/touch-controls.cjs && node tests/chiller-schedule.cjs && node tests/fcu-time.cjs
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug -Pandroid.useAndroidX=true
      - uses: actions/upload-artifact@v4
        with:
          name: FacilityReport-v1.0.4-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
